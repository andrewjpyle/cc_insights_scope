name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests and enforce the test floor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee test.log
          ran=$(grep -oE '^Ran [0-9]+ tests?' test.log | grep -oE '[0-9]+')
          echo "tests run: $ran"
          if [ "$ran" -lt 18 ]; then
            echo "test floor is 18, saw $ran" >&2
            exit 1
          fi
